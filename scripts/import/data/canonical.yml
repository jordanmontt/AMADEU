# The canonical edition of Sangre y Sueño (ADR 0057): its sections, its order and its texts.
# Source: "Texto canonico - Sangre y Sueño 2027.pdf", in the project's Requerimientos folder.
#
# Each entry is a text of the edition, in book order:
# - printed: the title as the PDF prints it (the import checks it, so the mapping cannot drift);
# - id: the archive's permanent id; a new file is created when none exists;
# - title: the title to use when the printed one has an obvious misprint;
# - altTitles: the titles of the same text in other editions, read from the editor's notes;
# - review: a doubt for the Foundation, shown in the pending tasks;
# - skip: why the text cannot be imported yet (the PDF has no verses for it).
#
# A text set as prose (paragraphs instead of verses) keeps its current verses from Tomo I and
# stays provisional; only its title, section and order change.
pdf: ../Requerimientos/Texto canonico - Sangre y Sueño 2027.pdf
work: sangre-y-sueno
edition:
  name: Sangre y sueño, edición conmemorativa, a cargo de Oscar Jordán Arandia
  year: '2027'
# Texts of these sections not placed below make the import fail.
replaces: [cancionero]
sections:
