        altTitles: [{ title: Manos del alba, source: Ediciones posteriores }]
        review: >-
          «Encuentros» está en el texto canónico, pero no en su tabla de contenido ni en la
          numeración de las canciones de 1981. Confirmar que forma parte del libro y si es un poema
          o una canción.
      - printed: Navigari neccesse est, vivire non neccesse
        id: navigari-neccesse-est-vivire-non-neccesse
