      - printed: La clara melodía del amor
        id: la-clara-melodia-del-amor
      - printed: Cordillera de Real
        id: cordillera-de-los-andes
        title: Cordillera Real
        altTitles: [{ title: Cordillera de los Andes, source: Ediciones de 1994 y 2013 }]
        review: >-
          El texto canónico titula «Cordillera de Real» y su tabla de contenido «CORDILLERA DE
          REAL»; aquí se usa «Cordillera Real», como la grabación. Confirmar el título.
      - printed: Los decretos del amor
