# Quality gate for every pull request and every push to main (RT-57).
# Deployment to Cloudflare Pages is added in milestone H7.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, unit, content and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      # The build re-encodes audio over 25 MiB with ffmpeg (ADR 0045).
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run build

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each browser job also runs its phone project (Firefox has none in Playwright).
          - browser: chromium
            projects: --project=chromium --project=phone-chromium
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=phone-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The runner has no sound card. Firefox cannot open an audio output without one and
      # stops every recording with NS_ERROR_DOM_MEDIA_MEDIASINK_ERR; a PulseAudio null sink
      # gives it one, so the player tests hear real playback.
      - if: matrix.browser == 'firefox'
        name: Give Firefox a virtual sound card
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Only from main, and only after every check and every browser passed (RT-57, RF-71): a
  # failing change publishes nothing and the previous site stays online. It stays idle until
  # the Foundation's Cloudflare project is connected (docs/deployment.md).
  deploy:
    name: Deploy to Cloudflare Pages
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check that deployment is configured
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment is not configured yet: nothing published (see docs/deployment.md)."
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.configured.outputs.ready == 'true'
        run: npm ci
      - if: steps.configured.outputs.ready == 'true'
        name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - if: steps.configured.outputs.ready == 'true'
        name: Build the site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - if: steps.configured.outputs.ready == 'true'
        name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
