year: '1981'
description: >-
  Los Relatos poéticos de Diego Calahumana obtuvieron el Primer Premio de Poesía Franz Tamayo en 1981.
  El libro de canciones reúne las letras de sus canciones, grabadas en el disco de 1984 y, con voz y
  guitarra, en grabaciones caseras entre 1993 y 1995.
